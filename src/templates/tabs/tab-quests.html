<!-- TAB: QUESTS & STORY -->
            <section x-show="activeTab === 'quests'" class="tab-view">
                <!-- QUESTS SECTION HEADER -->
                <div class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-dark-800 border border-gray-700 rounded-xl p-4 shadow">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-brand-300 flex items-center gap-2">
                            <span>🗺️</span> Quests & Campaign Story
                        </h2>
                        <p class="text-xs text-gray-400 mt-0.5">Track adventures, milestones, objectives, and world lore</p>
                    </div>

                    <div class="flex items-center gap-2">
                        <!-- Filters -->
                        <div class="flex bg-dark-950 p-1 rounded-xl border border-gray-800 text-xs font-bold">
                            <button type="button" @click="questFilter = 'active'"
                                class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"
                                :class="questFilter === 'active' ? 'bg-brand-600 text-white shadow' : 'text-gray-400 hover:text-gray-200'">
                                <span>Active</span>
                                <span class="bg-dark-900/80 px-1.5 py-0.2 rounded-full text-[10px]" x-text="activeQuestsCount"></span>
                            </button>
                            <button type="button" @click="questFilter = 'completed'"
                                class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"
                                :class="questFilter === 'completed' ? 'bg-brand-600 text-white shadow' : 'text-gray-400 hover:text-gray-200'">
                                <span>Completed</span>
                                <span class="bg-dark-900/80 px-1.5 py-0.2 rounded-full text-[10px]" x-text="completedQuestsCount"></span>
                            </button>
                            <button type="button" @click="questFilter = 'all'"
                                class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"
                                :class="questFilter === 'all' ? 'bg-brand-600 text-white shadow' : 'text-gray-400 hover:text-gray-200'">
                                <span>All</span>
                                <span class="bg-dark-900/80 px-1.5 py-0.2 rounded-full text-[10px]" x-text="(data.quests || []).length"></span>
                            </button>
                        </div>

                        <!-- Add Quest Button -->
                        <button type="button" @click="openQuestModal()"
                            class="px-3.5 py-2 bg-brand-600 hover:bg-brand-500 border border-brand-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow active:scale-95">
                            <span>➕</span> New Quest
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- QUESTS LIST (2 COLS ON DESKTOP) -->
                    <div class="lg:col-span-2 space-y-3">
                        <template x-for="q in filteredQuests" :key="q.id">
                            <div class="bg-dark-800 border rounded-xl p-4 shadow transition relative"
                                :class="q.status === 'completed' ? 'border-gray-800 opacity-75 bg-dark-850' : 'border-gray-700 hover:border-brand-500/50'">
                                <div class="flex items-start gap-3">
                                    <input type="checkbox"
                                        class="cb-custom cb-success mt-1 shrink-0"
                                        :checked="q.status === 'completed'"
                                        @change="toggleQuestStatus(q.id)"
                                        :title="q.status === 'completed' ? 'Mark as Active' : 'Mark as Completed'">

                                    <div class="flex-grow min-w-0">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <h3 class="font-bold text-sm md:text-base text-gray-100 flex items-center gap-2"
                                                :class="{'line-through text-gray-500': q.status === 'completed'}">
                                                <span x-text="q.title"></span>
                                            </h3>
                                            <div class="flex items-center gap-1">
                                                <button type="button" @click="openQuestModal(q)"
                                                    class="p-1 text-gray-400 hover:text-brand-300 rounded transition" title="Edit Quest">
                                                    ✏️
                                                </button>
                                                <button type="button" @click="removeQuest(q.id)"
                                                    class="p-1 text-gray-400 hover:text-red-400 rounded transition" title="Delete Quest">
                                                    🗑️
                                                </button>
                                            </div>
                                        </div>

                                        <p x-show="q.desc" class="text-xs text-gray-300 mt-2 leading-relaxed whitespace-pre-wrap" x-text="q.desc"></p>

                                        <div class="flex flex-wrap items-center gap-2 mt-3 pt-2 border-t border-gray-800/80 text-[11px]">
                                            <span x-show="q.location" class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-dark-900 border border-gray-700 text-gray-300">
                                                <span>📍</span> <span x-text="q.location"></span>
                                            </span>
                                            <span x-show="q.reward" class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-amber-950/40 border border-amber-600/40 text-amber-300">
                                                <span>🏆</span> <span x-text="q.reward"></span>
                                            </span>
                                            <span x-show="q.createdAt" class="text-gray-500 text-[10px] ml-auto" x-text="`Created: ${q.createdAt}`"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div x-show="filteredQuests.length === 0" class="bg-dark-850 border border-gray-800 rounded-xl p-8 text-center">
                            <span class="text-4xl block mb-2">📜</span>
                            <p class="text-sm font-bold text-gray-400">No quests found</p>
                            <p class="text-xs text-gray-500 mt-1">Track quests, bounties, and goals by clicking "New Quest".</p>
                        </div>
                    </div>

                    <!-- CAMPAIGN & WORLD NOTES (1 COL ON DESKTOP) -->
                    <div class="bg-dark-800 border border-gray-700 rounded-xl p-4 md:p-5 shadow flex flex-col">
                        <div class="flex items-center justify-between border-b border-gray-700 pb-2 mb-3">
                            <h3 class="text-base font-bold text-gray-100 flex items-center gap-2">
                                <span>📖</span> Campaign & World Notes
                            </h3>
                            <span class="text-[11px] text-gray-400 font-mono">Auto-saved</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-3">
                            Free-form chronicle for campaign lore, NPC contacts, secrets, locations, and session summaries.
                        </p>
                        <textarea x-model="data.campaignNotes" @input="saveCampaignNotes()"
                            class="w-full flex-grow min-h-[350px] bg-dark-950 border border-gray-800 rounded-xl p-3 text-xs md:text-sm text-gray-200 outline-none focus:border-brand-500 resize-y leading-relaxed font-sans"
                            placeholder="Write your campaign chronicle, lore, rumors, NPC notes, places of interest..."></textarea>
                    </div>
                </div>
            </section>
