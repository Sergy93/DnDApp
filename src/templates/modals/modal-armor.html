<!-- MODAL: ARMOR & PROTECTION MANAGEMENT -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalArmorOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto shadow-[0_0_50px_rgba(168,85,247,0.35)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-4">
                <h3 class="text-base font-bold text-white" x-text="editingArmorIndex !== null ? '✏️ Edit Armor / Protection' : '🛡️ Add Armor / Protection'"></h3>
                <button @click="modalArmorOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form @submit.prevent="handleSaveArmor()" class="space-y-3.5 text-xs md:text-sm">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Armor / Item Name *</label>
                    <input type="text" x-model="armorForm.name" required placeholder="e.g. Studded Leather, Shield, Cloak of Protection..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Type</label>
                        <select x-model="armorForm.type"
                            @change="if (armorForm.type === 'accessory' && (armorForm.baseAc === 12 || armorForm.baseAc === 10)) armorForm.baseAc = 0; else if (armorForm.type === 'shield' && armorForm.baseAc === 0) armorForm.baseAc = 2; else if (armorForm.type === 'light' && armorForm.baseAc === 0) armorForm.baseAc = 11;"
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                            <option value="light">Light Armor (+ full DEX)</option>
                            <option value="medium">Medium Armor (+ max 2 DEX)</option>
                            <option value="heavy">Heavy Armor (No DEX)</option>
                            <option value="shield">Shield (+2 AC bonus)</option>
                            <option value="accessory">Magic Item / Accessory (Cloak, Ring, Amulet... +0 or +AC)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1" x-text="armorForm.type === 'shield' || armorForm.type === 'accessory' ? 'AC Bonus (0 = no AC change)' : 'Base AC'"></label>
                        <input type="number" min="0" x-model.number="armorForm.baseAc" required
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                    </div>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="armorStealthDisadv" class="cb-custom" x-model="armorForm.stealthDisadv">
                    <label for="armorStealthDisadv" class="text-gray-300 font-semibold cursor-pointer select-none">
                        Imposes Stealth Disadvantage
                    </label>
                </div>

                <!-- GRANTED SPELLS (DYNAMIC SELECT FROM COMPENDIUM) -->
                <div class="bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <label class="block text-gray-300 font-semibold mb-1 flex items-center justify-between">
                        <span>✨ Granted Spells</span>
                        <span class="text-[11px] text-gray-400 font-normal">Select from Compendium</span>
                    </label>
                    <div class="flex gap-2">
                        <select x-model="selectedSpellToAdd" class="flex-1 bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                            <option value="">-- Choose a Spell --</option>
                            <template x-for="sp in allCompendiumSpellsList" :key="sp.name">
                                <option :value="sp.name" x-text="`${sp.name} (Lvl ${sp.level === 0 ? 'Cantrip' : sp.level})`"></option>
                            </template>
                        </select>
                        <button type="button" @click="addSpellToArmorForm()" class="px-3 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-bold shrink-0">
                            ➕ Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2" x-show="armorForm.grantedSpells && armorForm.grantedSpells.length > 0">
                        <template x-for="(sp, sIdx) in armorForm.grantedSpells" :key="sp">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-purple-950/80 border border-purple-800 text-purple-200">
                                <span x-text="`✨ ${sp}`"></span>
                                <button type="button" @click="removeSpellFromArmorForm(sIdx)" class="text-purple-300 hover:text-white font-bold ml-1 text-sm leading-none">&times;</button>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- DAMAGE RESISTANCES (DYNAMIC SELECT FROM DAMAGE TYPES) -->
                <div class="bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <label class="block text-gray-300 font-semibold mb-1 flex items-center justify-between">
                        <span>🛡️ Damage Resistances</span>
                        <span class="text-[11px] text-gray-400 font-normal">Select Damage Type</span>
                    </label>
                    <div class="flex gap-2">
                        <select x-model="selectedResToAdd" class="flex-1 bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                            <option value="">-- Choose Resistance --</option>
                            <template x-for="dt in allDamageTypesList" :key="dt.id">
                                <option :value="dt.name" x-text="`${dt.icon} ${dt.name}`"></option>
                            </template>
                        </select>
                        <button type="button" @click="addResToArmorForm()" class="px-3 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold shrink-0">
                            ➕ Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2" x-show="armorForm.resistances && armorForm.resistances.length > 0">
                        <template x-for="(res, rIdx) in armorForm.resistances" :key="res">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-amber-950/80 border border-amber-800 text-amber-200">
                                <span x-text="`🛡️ ${res}`"></span>
                                <button type="button" @click="removeResFromArmorForm(rIdx)" class="text-amber-300 hover:text-white font-bold ml-1 text-sm leading-none">&times;</button>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- ATTRIBUTE & SAVING THROW BONUSES -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Attribute Bonus / Advantage</label>
                        <div class="space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <select x-model="armorForm.bonusAttr" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                                    <option value="">None</option>
                                    <template x-for="attr in CONSTANTS.ABILITY_KEYS" :key="attr">
                                        <option :value="attr" x-text="attr"></option>
                                    </template>
                                </select>
                                <select x-model="armorForm.attrMode" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs" :disabled="!armorForm.bonusAttr">
                                    <option value="bonus">+ / - Bonus</option>
                                    <option value="advantage">🎲 Advantage</option>
                                </select>
                            </div>
                            <input x-show="armorForm.attrMode === 'bonus'" type="number" x-model.number="armorForm.bonusAttrVal" placeholder="+/- Bonus value"
                                class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Saving Throw Bonus / Advantage</label>
                        <div class="space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <select x-model="armorForm.saveType" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                                    <option value="">None</option>
                                    <option value="all">All Saves</option>
                                    <template x-for="attr in CONSTANTS.ABILITY_KEYS" :key="attr">
                                        <option :value="attr" x-text="`${attr} Save`"></option>
                                    </template>
                                </select>
                                <select x-model="armorForm.saveMode" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs" :disabled="!armorForm.saveType">
                                    <option value="bonus">+ / - Bonus</option>
                                    <option value="advantage">🎲 Advantage</option>
                                </select>
                            </div>
                            <input x-show="armorForm.saveMode === 'bonus'" type="number" x-model.number="armorForm.saveVal" placeholder="+/- Bonus value"
                                class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                        </div>
                    </div>
                </div>

                <!-- SKILL ADVANTAGES -->
                <div class="bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <label class="block text-gray-300 font-semibold mb-1 flex items-center justify-between">
                        <span>🎲 Skill Advantage</span>
                        <span class="text-[11px] text-gray-400 font-normal">Select Skill</span>
                    </label>
                    <div class="flex gap-2">
                        <select x-model="selectedSkillAdvToAdd" class="flex-1 bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                            <option value="">-- Choose Skill --</option>
                            <template x-for="sk in allSkillsList" :key="sk.name || sk">
                                <option :value="sk.name || sk" x-text="sk.name || sk"></option>
                            </template>
                        </select>
                        <button type="button" @click="addSkillAdvToArmorForm()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shrink-0">
                            ➕ Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2" x-show="armorForm.advantageSkills && armorForm.advantageSkills.length > 0">
                        <template x-for="(sk, kIdx) in armorForm.advantageSkills" :key="sk">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-emerald-950/80 border border-emerald-800 text-emerald-200">
                                <span x-text="`🎲 Adv: ${sk}`"></span>
                                <button type="button" @click="removeSkillAdvFromArmorForm(kIdx)" class="text-emerald-300 hover:text-white font-bold ml-1 text-sm leading-none">&times;</button>
                            </span>
                        </template>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Special / Notes</label>
                    <input type="text" x-model="armorForm.special" placeholder="e.g. Light armor. Add your full Dexterity modifier to AC."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-gray-800">
                    <button type="button" @click="modalArmorOpen = false"
                        class="px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit"
                        class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save Armor</button>
                </div>
            </form>
        </div>
    </div>
