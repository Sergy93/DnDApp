<!-- MODAL: CONCENTRATION SWITCH -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalConcOverrideOpen">
        <div class="bg-dark-900 border-2 border-amber-500/80 rounded-2xl max-w-sm w-full p-5 shadow-[0_0_40px_rgba(245,158,11,0.3)]">
            <div class="flex items-center gap-3 mb-3 border-b border-gray-800 pb-2">
                <span class="text-2xl">⚠️</span>
                <h3 class="text-base font-bold text-amber-300">Active Concentration</h3>
            </div>
            <p class="text-xs md:text-sm text-gray-200 leading-relaxed mb-4">
                You are currently concentrating on <strong class="text-brand-300" x-text="data.concentration.spellName"></strong>.<br><br>
                Casting <strong class="text-white" x-text="pendingConcentrationSpell"></strong> will break your previous concentration. Do you want to replace it?
            </p>
            <div class="flex justify-end gap-2 pt-2 border-t border-gray-800 text-xs">
                <button @click="closeConcentrationModal(false)" class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg font-bold text-gray-300">Cancel</button>
                <button @click="closeConcentrationModal(true)" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-400 rounded-lg font-bold text-black">Replace Concentration</button>
            </div>
        </div>
    </div>
