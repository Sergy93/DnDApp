<!-- MODAL: STORY ITEMS MANAGEMENT -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalStoryItemOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto shadow-[0_0_50px_rgba(168,85,247,0.35)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <h3 class="text-base font-bold text-white" x-text="editingStoryItemIndex !== null ? '✏️ Edit Story Item' : '✨ Add Story Item'"></h3>
                <button @click="modalStoryItemOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form @submit.prevent="handleSaveStoryItem()" class="space-y-3 text-xs md:text-sm">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Item Name *</label>
                    <input type="text" x-model="storyItemForm.name" required placeholder="e.g. Family Relic, Sealed Letter, Cloak of the Mountebank..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Description / Properties</label>
                    <textarea x-model="storyItemForm.desc" rows="3" placeholder="Details, clues, magical effects..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500"></textarea>
                </div>
                <div class="flex flex-wrap gap-4 items-center bg-dark-950/60 p-2.5 rounded-lg border border-gray-800">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" class="cb-custom w-4 h-4" x-model="storyItemForm.isSpecial">
                        <span class="text-amber-300 font-bold text-xs">🪙 Key Item</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" class="cb-custom w-4 h-4" x-model="storyItemForm.isMagic">
                        <span class="text-purple-300 font-bold text-xs">✨ Magic Item</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" class="cb-custom w-4 h-4" x-model="storyItemForm.equipped">
                        <span class="text-brand-300 font-bold text-xs">🛡️ Equipped</span>
                    </label>
                </div>

                <!-- GRANTED SPELLS -->
                <div class="bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <label class="block text-gray-300 font-semibold mb-1 flex items-center justify-between">
                        <span>✨ Granted Spells</span>
                        <span class="text-[11px] text-gray-400 font-normal">Select from Compendium</span>
                    </label>
                    <div class="flex gap-2">
                        <select x-model="storySpellToAdd" class="flex-1 bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                            <option value="">-- Choose a Spell --</option>
                            <template x-for="sp in allCompendiumSpellsList" :key="sp.name">
                                <option :value="sp.name" x-text="`${sp.name} (Lvl ${sp.level === 0 ? 'Cantrip' : sp.level})`"></option>
                            </template>
                        </select>
                        <button type="button" @click="addSpellToStoryForm()" class="px-3 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-bold shrink-0">
                            ➕ Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2" x-show="storyItemForm.grantedSpells && storyItemForm.grantedSpells.length > 0">
                        <template x-for="(sp, sIdx) in storyItemForm.grantedSpells" :key="sp">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-purple-950/80 border border-purple-800 text-purple-200">
                                <span x-text="`✨ ${sp}`"></span>
                                <button type="button" @click="removeSpellFromStoryForm(sIdx)" class="text-purple-300 hover:text-white font-bold ml-1 text-sm leading-none">&times;</button>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- DAMAGE RESISTANCES -->
                <div class="bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <label class="block text-gray-300 font-semibold mb-1 flex items-center justify-between">
                        <span>🛡️ Damage Resistances</span>
                        <span class="text-[11px] text-gray-400 font-normal">Select Damage Type</span>
                    </label>
                    <div class="flex gap-2">
                        <select x-model="storyResToAdd" class="flex-1 bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                            <option value="">-- Choose Resistance --</option>
                            <template x-for="dt in allDamageTypesList" :key="dt.id">
                                <option :value="dt.name" x-text="`${dt.icon} ${dt.name}`"></option>
                            </template>
                        </select>
                        <button type="button" @click="addResToStoryForm()" class="px-3 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold shrink-0">
                            ➕ Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2" x-show="storyItemForm.resistances && storyItemForm.resistances.length > 0">
                        <template x-for="(res, rIdx) in storyItemForm.resistances" :key="res">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-amber-950/80 border border-amber-800 text-amber-200">
                                <span x-text="`🛡️ ${res}`"></span>
                                <button type="button" @click="removeResFromStoryForm(rIdx)" class="text-amber-300 hover:text-white font-bold ml-1 text-sm leading-none">&times;</button>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- ATTRIBUTE & SAVING THROW BONUSES -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Attribute Bonus / Advantage</label>
                        <div class="space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <select x-model="storyItemForm.bonusAttr" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                                    <option value="">None</option>
                                    <option value="STR">STR</option>
                                    <option value="DEX">DEX</option>
                                    <option value="CON">CON</option>
                                    <option value="INT">INT</option>
                                    <option value="WIS">WIS</option>
                                    <option value="CHA">CHA</option>
                                </select>
                                <select x-model="storyItemForm.attrMode" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs" :disabled="!storyItemForm.bonusAttr">
                                    <option value="bonus">+ / - Bonus</option>
                                    <option value="advantage">🎲 Advantage</option>
                                </select>
                            </div>
                            <input x-show="storyItemForm.attrMode === 'bonus'" type="number" x-model.number="storyItemForm.bonusAttrVal" placeholder="+/- Bonus value"
                                class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Saving Throw Bonus / Advantage</label>
                        <div class="space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <select x-model="storyItemForm.saveType" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                                    <option value="">None</option>
                                    <option value="all">All Saves</option>
                                    <option value="STR">STR Save</option>
                                    <option value="DEX">DEX Save</option>
                                    <option value="CON">CON Save</option>
                                    <option value="INT">INT Save</option>
                                    <option value="WIS">WIS Save</option>
                                    <option value="CHA">CHA Save</option>
                                </select>
                                <select x-model="storyItemForm.saveMode" class="bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs" :disabled="!storyItemForm.saveType">
                                    <option value="bonus">+ / - Bonus</option>
                                    <option value="advantage">🎲 Advantage</option>
                                </select>
                            </div>
                            <input x-show="storyItemForm.saveMode === 'bonus'" type="number" x-model.number="storyItemForm.saveVal" placeholder="+/- Bonus value"
                                class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                        </div>
                    </div>
                </div>

                <!-- SKILL ADVANTAGES -->
                <div class="bg-dark-950/60 p-3 rounded-xl border border-gray-800">
                    <label class="block text-gray-300 font-semibold mb-1 flex items-center justify-between">
                        <span>🎲 Skill Advantage</span>
                        <span class="text-[11px] text-gray-400 font-normal">Select Skill</span>
                    </label>
                    <div class="flex gap-2">
                        <select x-model="storySkillAdvToAdd" class="flex-1 bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 text-xs">
                            <option value="">-- Choose Skill --</option>
                            <template x-for="sk in allSkillsList" :key="sk">
                                <option :value="sk" x-text="sk"></option>
                            </template>
                        </select>
                        <button type="button" @click="addSkillAdvToStoryForm()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shrink-0">
                            ➕ Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-2" x-show="storyItemForm.advantageSkills && storyItemForm.advantageSkills.length > 0">
                        <template x-for="(sk, kIdx) in storyItemForm.advantageSkills" :key="sk">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-emerald-950/80 border border-emerald-800 text-emerald-200">
                                <span x-text="`🎲 Adv: ${sk}`"></span>
                                <button type="button" @click="removeSkillAdvFromStoryForm(kIdx)" class="text-emerald-300 hover:text-white font-bold ml-1 text-sm leading-none">&times;</button>
                            </span>
                        </template>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalStoryItemOpen = false" class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save</button>
                </div>
            </form>
        </div>
    </div>
