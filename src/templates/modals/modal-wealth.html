<!-- MODAL: WEALTH / COINS MANAGER -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalWealthOpen">
        <div class="bg-dark-900 border border-amber-500/60 rounded-2xl max-w-md w-full p-5 shadow-[0_0_50px_rgba(245,158,11,0.3)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2.5 mb-4">
                <h3 class="text-base font-bold text-amber-300 flex items-center gap-2">
                    <span>🪙</span> Manage Coins & Wealth
                </h3>
                <button @click="modalWealthOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <!-- Mode Selector: Add vs Spend -->
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button type="button" @click="wealthManagerMode = 'add'"
                    class="py-2 rounded-xl font-bold text-xs border transition flex items-center justify-center gap-1.5"
                    :class="wealthManagerMode === 'add' ? 'bg-emerald-600 text-white border-emerald-400 shadow' : 'bg-dark-950 text-gray-400 border-gray-800'">
                    <span>➕</span> Add / Loot Coins
                </button>
                <button type="button" @click="wealthManagerMode = 'spend'"
                    class="py-2 rounded-xl font-bold text-xs border transition flex items-center justify-center gap-1.5"
                    :class="wealthManagerMode === 'spend' ? 'bg-red-600 text-white border-red-400 shadow' : 'bg-dark-950 text-gray-400 border-gray-800'">
                    <span>➖</span> Spend / Pay Coins
                </button>
            </div>

            <form @submit.prevent="applyWealthChange()" class="space-y-4 text-xs md:text-sm">
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center">
                    <div class="bg-dark-950 p-2 rounded-xl border border-gray-800">
                        <span class="text-xs font-bold text-cyan-300 block">Plat. (PP)</span>
                        <span class="text-[10px] text-gray-500 block mb-1" x-text="`Curr: ${data.inventory?.wealth?.pp || 0}`"></span>
                        <input type="number" min="0" x-model.number="wealthForm.pp"
                            class="w-full bg-dark-900 border border-gray-700 rounded-lg p-1.5 text-center font-black text-cyan-300 text-base outline-none focus:border-cyan-400">
                    </div>
                    <div class="bg-dark-950 p-2 rounded-xl border border-gray-800">
                        <span class="text-xs font-bold text-yellow-400 block">Gold (GP)</span>
                        <span class="text-[10px] text-gray-500 block mb-1" x-text="`Curr: ${data.inventory?.wealth?.gp || 0}`"></span>
                        <input type="number" min="0" x-model.number="wealthForm.gp"
                            class="w-full bg-dark-900 border border-gray-700 rounded-lg p-1.5 text-center font-black text-yellow-300 text-base outline-none focus:border-yellow-500">
                    </div>
                    <div class="bg-dark-950 p-2 rounded-xl border border-gray-800">
                        <span class="text-xs font-bold text-teal-400 block">Elec. (EP)</span>
                        <span class="text-[10px] text-gray-500 block mb-1" x-text="`Curr: ${data.inventory?.wealth?.ep || 0}`"></span>
                        <input type="number" min="0" x-model.number="wealthForm.ep"
                            class="w-full bg-dark-900 border border-gray-700 rounded-lg p-1.5 text-center font-black text-teal-300 text-base outline-none focus:border-teal-500">
                    </div>
                    <div class="bg-dark-950 p-2 rounded-xl border border-gray-800">
                        <span class="text-xs font-bold text-gray-200 block">Silver (SP)</span>
                        <span class="text-[10px] text-gray-500 block mb-1" x-text="`Curr: ${data.inventory?.wealth?.sp || 0}`"></span>
                        <input type="number" min="0" x-model.number="wealthForm.sp"
                            class="w-full bg-dark-900 border border-gray-700 rounded-lg p-1.5 text-center font-black text-gray-100 text-base outline-none focus:border-gray-400">
                    </div>
                    <div class="bg-dark-950 p-2 rounded-xl border border-gray-800 col-span-2 sm:col-span-1">
                        <span class="text-xs font-bold text-orange-400 block">Copper (CP)</span>
                        <span class="text-[10px] text-gray-500 block mb-1" x-text="`Curr: ${data.inventory?.wealth?.cp || 0}`"></span>
                        <input type="number" min="0" x-model.number="wealthForm.cp"
                            class="w-full bg-dark-900 border border-gray-700 rounded-lg p-1.5 text-center font-black text-orange-400 text-base outline-none focus:border-orange-500">
                    </div>
                </div>

                <div>
                    <label class="text-gray-400 block mb-1 text-xs">Reason / Note (optional, saved in Log)</label>
                    <input type="text" x-model="wealthForm.reason"
                        :placeholder="wealthManagerMode === 'spend' ? 'e.g. Bought Healing Potion, tavern inn...' : 'e.g. Looted chest, quest reward...'"
                        class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2 text-white text-xs outline-none focus:border-amber-500">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalWealthOpen = false"
                        class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit"
                        class="px-5 py-2 rounded-lg text-xs font-bold text-white shadow transition"
                        :class="wealthManagerMode === 'spend' ? 'bg-red-600 hover:bg-red-500' : 'bg-emerald-600 hover:bg-emerald-500'"
                        x-text="wealthManagerMode === 'spend' ? 'Spend Coins' : 'Add Coins'"></button>
                </div>
            </form>
        </div>
    </div>
