<!-- MODAL: ADD SPELL -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalSpellAddOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-xl w-full max-h-[85vh] p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3 shrink-0">
                <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                    <span>📖</span> Add Spell to Spellbook
                </h3>
                <button @click="modalSpellAddOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <!-- Tab Selector -->
            <div class="flex gap-2 border-b border-gray-800 pb-2.5 mb-3 shrink-0">
                <button type="button" @click="spellAddTab = 'compendium'"
                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition"
                    :class="spellAddTab === 'compendium' ? 'bg-brand-600 text-white' : 'bg-dark-950 text-gray-400 hover:text-white'">
                    📚 From Compendium (<span x-text="compendiumCount"></span> spells)
                </button>
                <button type="button" @click="spellAddTab = 'manual'"
                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition"
                    :class="spellAddTab === 'manual' ? 'bg-brand-600 text-white' : 'bg-dark-950 text-gray-400 hover:text-white'">
                    ✏️ Create Custom Spell
                </button>
            </div>

            <!-- Tab 1: Compendium -->
            <div x-show="spellAddTab === 'compendium'" class="flex flex-col flex-1 min-h-0 space-y-2.5">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2 shrink-0">
                    <div class="md:col-span-2">
                        <input type="text" x-model="spellCompendiumSearch" placeholder="Search spell by name..."
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-xs text-white outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <select x-model="spellCompendiumLevelFilter"
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-xs text-white outline-none focus:border-brand-500">
                            <option value="all">Any Level</option>
                            <option value="0">Cantrips (Lvl 0)</option>
                            <option value="1">1st Level</option>
                            <option value="2">2nd Level</option>
                            <option value="3">3rd Level</option>
                            <option value="4">4th Level</option>
                            <option value="5">5th Level</option>
                            <option value="6">6th Level</option>
                            <option value="7">7th Level</option>
                            <option value="8">8th Level</option>
                            <option value="9">9th Level</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0 text-xs">
                    <span class="text-gray-400">Assign Source:</span>
                    <select x-model="spellCompendiumSource"
                        class="bg-dark-950 border border-gray-700 rounded p-1 text-xs text-white outline-none">
                        <template x-for="c in data.identity?.classes || []" :key="c.name">
                            <option :value="c.name" x-text="c.name"></option>
                        </template>
                        <option value="other">Other / Feat / Item</option>
                    </select>
                </div>

                <div class="flex-1 overflow-y-auto space-y-1.5 pr-1">
                    <template x-for="csp in filteredCompendiumSpells" :key="csp.name">
                        <div class="p-2.5 bg-dark-950 border border-gray-800 rounded-xl flex items-center justify-between gap-2 hover:border-brand-500/50 transition">
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded bg-dark-900 border border-gray-700 text-xs font-black text-brand-300"
                                        x-text="csp.level === 0 ? 'Cantrip' : `Lvl ${csp.level}`"></span>
                                    <strong class="text-xs sm:text-sm text-white truncate" x-text="csp.name"></strong>
                                    <span x-show="csp.conc" class="text-xs bg-amber-950/60 border border-amber-500/40 text-amber-300 px-1.5 py-0.5 rounded font-bold">Conc</span>
                                </div>
                                <div class="text-xs text-gray-400 mt-0.5" x-text="`${csp.actionType} • ${csp.range} • ${csp.duration}`"></div>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button type="button" @click="uiAlert(csp.desc, csp.name, '📖')" class="p-1 text-xs text-gray-400 hover:text-white" title="Preview">👁️</button>
                                <button type="button" @click="addSpellFromCompendium(csp)"
                                    class="px-2.5 py-1 bg-brand-600 hover:bg-brand-500 rounded text-xs font-bold text-white shadow">➕ Add</button>
                            </div>
                        </div>
                    </template>
                    <div x-show="filteredCompendiumSpells.length === 0" class="text-gray-500 text-center py-6 text-xs sm:text-sm italic">
                        No available spells found with that criteria (or they are already in your spellbook).
                    </div>
                </div>
            </div>

            <!-- Tab 2: Manual / Custom -->
            <form x-show="spellAddTab === 'manual'" @submit.prevent="handleSaveManualSpell()" class="flex-1 overflow-y-auto space-y-3 text-xs md:text-sm pr-1">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Spell Name *</label>
                    <input type="text" x-model="spellManualForm.name" required placeholder="e.g. Fireball, Sunbeam..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Level</label>
                        <select x-model.number="spellManualForm.level" class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none">
                            <option value="0">Cantrip (0)</option>
                            <option value="1">1st Level</option>
                            <option value="2">2nd Level</option>
                            <option value="3">3rd Level</option>
                            <option value="4">4th Level</option>
                            <option value="5">5th Level</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Action Type</label>
                        <select x-model="spellManualForm.actionType" class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none">
                            <option value="action">Action</option>
                            <option value="bonus">Bonus Action</option>
                            <option value="reaction">Reaction</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Range</label>
                        <input type="text" x-model="spellManualForm.range" placeholder="e.g. 60 ft, Self..."
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Damage or Healing</label>
                        <input type="text" x-model="spellManualForm.damage" placeholder="e.g. 3d6, 8d6..."
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Duration</label>
                        <input type="text" x-model="spellManualForm.duration" placeholder="e.g. Instantaneous, 1 min..."
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none">
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" class="cb-custom w-4 h-4" x-model="spellManualForm.conc">
                        <span class="text-amber-300 font-bold text-xs">🧠 Requires Concentration</span>
                    </label>
                </div>
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Spell Description</label>
                    <textarea x-model="spellManualForm.desc" rows="3" placeholder="Effects, saving throws..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalSpellAddOpen = false" class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save Spell</button>
                </div>
            </form>
        </div>
    </div>
