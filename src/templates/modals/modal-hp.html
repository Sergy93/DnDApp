<!-- MODAL: DAMAGE / HEAL MANAGER -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalHpManagerOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-sm w-full p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                    <span>⚡</span> Damage / Heal Manager
                </h3>
                <button @click="modalHpManagerOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <div class="grid grid-cols-3 gap-1.5 mb-4 p-1 bg-dark-950 rounded-xl border border-gray-800 text-xs font-bold">
                <button type="button" @click="hpManagerMode = 'damage'"
                    class="py-1.5 rounded-lg transition"
                    :class="hpManagerMode === 'damage' ? 'bg-red-600 text-white shadow' : 'text-gray-400 hover:text-white'">💥 Damage</button>
                <button type="button" @click="hpManagerMode = 'heal'"
                    class="py-1.5 rounded-lg transition"
                    :class="hpManagerMode === 'heal' ? 'bg-green-600 text-white shadow' : 'text-gray-400 hover:text-white'">💚 Heal</button>
                <button type="button" @click="hpManagerMode = 'temp'"
                    class="py-1.5 rounded-lg transition"
                    :class="hpManagerMode === 'temp' ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-white'">🛡️ Temp</button>
            </div>

            <div class="bg-dark-950 p-3 rounded-xl border border-gray-800 mb-3 text-xs flex justify-between items-center">
                <span class="text-gray-400">Current state:</span>
                <span class="font-bold text-white">
                    <span class="text-red-400" x-text="data.vitals.currentHp"></span> / <span x-text="data.vitals.maxHp"></span> HP
                    <span x-show="data.vitals.tempHp > 0" class="text-blue-400" x-text="`(+${data.vitals.tempHp} temp)`"></span>
                </span>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1 text-xs"
                        x-text="hpManagerMode === 'damage' ? 'Damage taken amount:' : (hpManagerMode === 'heal' ? 'Hit points to heal:' : 'Temporary hit points to assign:')"></label>
                    <div class="flex items-center gap-2">
                        <input type="number" min="1" x-model.number="hpManagerAmount"
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2.5 text-center text-xl font-black text-white outline-none focus:border-brand-500">
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button type="button" @click="hpManagerAmount = (parseInt(hpManagerAmount, 10) || 0) + 1" class="flex-1 py-1 bg-dark-800 hover:bg-dark-700 rounded text-xs text-gray-300 font-bold">+1</button>
                        <button type="button" @click="hpManagerAmount = (parseInt(hpManagerAmount, 10) || 0) + 5" class="flex-1 py-1 bg-dark-800 hover:bg-dark-700 rounded text-xs text-gray-300 font-bold">+5</button>
                        <button type="button" @click="hpManagerAmount = (parseInt(hpManagerAmount, 10) || 0) + 10" class="flex-1 py-1 bg-dark-800 hover:bg-dark-700 rounded text-xs text-gray-300 font-bold">+10</button>
                    </div>
                </div>

                <!-- Damage Resistance Controls (Supports partial resisted damage e.g. 10 fire + 10 physical) -->
                <div x-show="hpManagerMode === 'damage' && (stats.resistances || []).length > 0" class="bg-amber-950/40 border border-amber-600/40 rounded-xl p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-amber-300 font-bold text-xs flex items-center gap-1.5">
                            <span>🛡️</span> Damage Resistance (÷2)
                        </span>
                        <!-- Quick toggle to resist ALL -->
                        <button type="button"
                            @click="hpManagerResistedAmount = (hpManagerResistedAmount > 0 ? 0 : hpManagerAmount)"
                            class="text-[11px] text-amber-400 hover:text-white underline font-semibold"
                            x-text="hpManagerResistedAmount > 0 ? 'Resist None' : 'Resist All'"></button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <label class="block text-gray-400 text-[11px] mb-1">Resistance Type:</label>
                            <select x-model="hpManagerResistanceType"
                                class="w-full bg-dark-950 border border-gray-700 rounded-lg p-1.5 text-xs text-white outline-none focus:border-amber-500">
                                <template x-for="res in stats.resistances" :key="res.id">
                                    <option :value="res.name" x-text="`${res.icon} ${res.name} (${res.source})`"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-400 text-[11px] mb-1">Resisted Portion:</label>
                            <input type="number" min="0" :max="hpManagerAmount" x-model.number="hpManagerResistedAmount"
                                class="w-full bg-dark-950 border border-gray-700 rounded-lg p-1.5 text-xs text-white text-center font-bold outline-none focus:border-amber-500"
                                placeholder="0">
                        </div>
                    </div>

                    <!-- Breakdown calculation preview -->
                    <div x-show="damageCalculation.hasResistanceReduction" class="bg-dark-950/80 p-2 rounded-lg border border-amber-500/30 text-[11px] text-gray-300">
                        <div class="flex justify-between items-center font-semibold">
                            <span>Calculation breakdown:</span>
                            <span class="text-amber-300 font-black" x-text="`${damageCalculation.finalDamage} total damage`"></span>
                        </div>
                        <div class="text-gray-400 mt-0.5"
                            x-text="`${damageCalculation.normalPart} normal + ${damageCalculation.halvedPart} ${hpManagerResistanceType || 'resisted'} (halved from ${damageCalculation.resistedPart})`"></div>
                    </div>
                </div>

                <p class="text-xs text-gray-400 italic leading-relaxed" x-show="hpManagerMode === 'damage'">
                    * Depletes temporary HP first before current HP. If you are concentrating, prompts with the CON save DC.
                </p>
                <p class="text-xs text-gray-400 italic leading-relaxed" x-show="hpManagerMode === 'heal'">
                    * Heals current HP up to your maximum (<span x-text="data.vitals.maxHp"></span>).
                </p>
                <p class="text-xs text-gray-400 italic leading-relaxed" x-show="hpManagerMode === 'temp'">
                    * Sets temporary hit points for the character.
                </p>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalHpManagerOpen = false" class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="button" @click="applyHpManagerAction()"
                        class="px-5 py-2 rounded-lg text-xs font-bold text-white shadow"
                        :class="hpManagerMode === 'damage' ? 'bg-red-600 hover:bg-red-500' : (hpManagerMode === 'heal' ? 'bg-green-600 hover:bg-green-500' : 'bg-blue-600 hover:bg-blue-500')"
                        x-text="hpManagerMode === 'damage' ? (damageCalculation.hasResistanceReduction ? `Apply ${damageCalculation.finalDamage} Damage` : 'Apply Damage') : (hpManagerMode === 'heal' ? 'Apply Healing' : 'Set Temp HP')"></button>
                </div>
            </div>
        </div>
    </div>
