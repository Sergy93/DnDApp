<!-- MODAL: TOOL & EQUIPMENT MANAGEMENT -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalToolOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-md w-full p-5 shadow-[0_0_50px_rgba(147,51,234,0.3)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <h3 class="text-base font-bold text-brand-300 flex items-center gap-1.5">
                    <span>🎒</span> <span x-text="editingToolIndex !== null ? 'Edit Tool / Equipment' : 'Add Tool / Equipment'"></span>
                </h3>
                <button @click="modalToolOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <form @submit.prevent="handleSaveTool()" class="space-y-3.5 text-xs md:text-sm">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Item Name *</label>
                    <input type="text" x-model="toolForm.name" required placeholder="e.g. Disguise Kit, Lute..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Icon</label>
                        <select x-model="toolForm.icon"
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                            <option value="🎒">🎒 Pack / Gear</option>
                            <option value="🎭">🎭 Disguise / Mask</option>
                            <option value="📜">📜 Forgery / Document</option>
                            <option value="🎸">🎸 Lute / Strings</option>
                            <option value="🥁">🥁 Drum / Percussion</option>
                            <option value="🎶">🎶 Wind / Music</option>
                            <option value="🧥">🧥 Cloak / Clothing</option>
                            <option value="👔">👔 Fine Clothes</option>
                            <option value="🔗">🔗 Manacles / Restraints</option>
                            <option value="🪝">🪝 Grappling Hook</option>
                            <option value="🗝️">🗝️ Key / Tool</option>
                            <option value="🎲">🎲 Gaming Set</option>
                        </select>
                    </div>

                    <div class="flex items-center pt-5">
                        <label class="flex items-center gap-2 cursor-pointer text-gray-200">
                            <input type="checkbox" x-model="toolForm.isInstrument" class="cb-custom w-4 h-4">
                            <span class="font-semibold text-xs">Musical Instrument (Focus)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Description & Usage / Rules</label>
                    <textarea x-model="toolForm.desc" rows="3" placeholder="How it works, checks involved, bonuses or utility..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500 resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalToolOpen = false" class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save</button>
                </div>
            </form>
        </div>
    </div>
