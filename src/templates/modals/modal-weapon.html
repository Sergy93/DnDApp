<!-- MODAL: WEAPON MANAGEMENT -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalWeaponOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-md w-full p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-4">
                <h3 class="text-base font-bold text-white" x-text="editingWeaponIndex !== null ? '✏️ Edit Weapon' : '⚔️ Add Weapon'"></h3>
                <button @click="modalWeaponOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form @submit.prevent="handleSaveWeapon()" class="space-y-3.5 text-xs md:text-sm">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Weapon Name *</label>
                    <input type="text" x-model="weaponForm.name" required placeholder="e.g. Rapier, Dagger, Crossbow..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Key Ability</label>
                        <select x-model="weaponForm.attrMode"
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                            <option value="finesse">Finesse (DEX or STR)</option>
                            <option value="dex">Dexterity (DEX)</option>
                            <option value="str">Strength (STR)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-semibold mb-1">Damage Dice</label>
                        <input type="text" x-model="weaponForm.dice" required placeholder="e.g. 1d8, 1d4..."
                            class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Damage Type</label>
                    <input type="text" x-model="weaponForm.damageType" placeholder="e.g. Piercing, Slashing, Bludgeoning..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Properties (comma separated)</label>
                    <input type="text" x-model="weaponForm.propsRaw" placeholder="e.g. Finesse, Light, Thrown 20/60'..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-gray-800">
                    <button type="button" @click="modalWeaponOpen = false"
                        class="px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit"
                        class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save Weapon</button>
                </div>
            </form>
        </div>
    </div>
