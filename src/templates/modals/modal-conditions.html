<!-- MODAL: CONDITION SELECTOR & 5E RULES -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalConditionsOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-xl w-full max-h-[85vh] p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3 shrink-0">
                <div class="flex items-center gap-2">
                    <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                        <span>✨</span> D&D 5e Conditions & Statuses
                    </h3>
                    <span x-show="activeConditionsList.length > 0"
                        class="bg-brand-600 text-white rounded-full px-2 py-0.5 text-xs font-black"
                        x-text="`${activeConditionsList.length} active`"></span>
                </div>
                <button @click="modalConditionsOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <div class="flex justify-between items-center mb-3 text-xs shrink-0">
                <span class="text-gray-400">Toggle conditions affecting your character:</span>
                <button type="button" @click="clearAllConditions()"
                    x-show="activeConditionsList.length > 0"
                    class="text-red-400 hover:text-red-300 font-bold underline">Clear All</button>
            </div>

            <!-- Conditions Grid -->
            <div class="overflow-y-auto space-y-2 flex-1 pr-1">
                <template x-for="cond in allConditions" :key="cond.id">
                    <div class="p-3 rounded-xl border transition flex items-start justify-between gap-3"
                        :class="hasCondition(cond.id) ? 'bg-purple-950/60 border-brand-500' : 'bg-dark-950 border-gray-800 hover:border-gray-700'">
                        <div class="flex items-start gap-3">
                            <span class="text-2xl mt-0.5" x-text="cond.icon"></span>
                            <div>
                                <div class="flex items-center gap-2">
                                    <strong class="text-white text-sm" x-text="cond.name"></strong>
                                    <span x-show="hasCondition(cond.id)"
                                        class="bg-brand-600 text-white text-[10px] font-black uppercase px-1.5 py-0.2 rounded-full">Active</span>
                                </div>
                                <div x-show="hasCondition(cond.id) && getConditionSource(cond.id)" class="text-[11px] text-brand-300 font-medium mt-0.5">
                                    Source: <strong class="text-white" x-text="getConditionSource(cond.id)"></strong>
                                </div>
                                <p class="text-xs text-gray-300 mt-0.5 leading-relaxed" x-text="cond.summary"></p>
                            </div>
                        </div>

                        <button type="button" @click="toggleCondition(cond.id)"
                            class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow"
                            :class="hasCondition(cond.id) ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-dark-800 hover:bg-brand-600 text-gray-300 hover:text-white border border-gray-700'"
                            x-text="hasCondition(cond.id) ? 'Remove' : '+ Apply'"></button>
                    </div>
                </template>
            </div>

            <div class="flex justify-end pt-3 border-t border-gray-800 shrink-0 mt-3">
                <button type="button" @click="modalConditionsOpen = false"
                    class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Done</button>
            </div>
        </div>
    </div>
