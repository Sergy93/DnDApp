<!-- MODAL: CAST SPELL -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3 md:p-4"
        x-show="modalCastSpellOpen">
        <div class="bg-dark-900 border border-brand-500/70 rounded-2xl max-w-xl w-full max-h-[90vh] p-5 shadow-[0_0_50px_rgba(168,85,247,0.4)] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2.5 mb-3.5 shrink-0">
                <h3 class="text-base md:text-lg font-bold text-brand-300 flex items-center gap-2">
                    <span>✨</span> Cast a Spell
                </h3>
                <button @click="modalCastSpellOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <form @submit.prevent="executeCastSpell()" class="space-y-3.5 text-xs md:text-sm overflow-y-auto pr-1 flex-1">
                <!-- 1. Select Spell -->
                <div>
                    <label class="text-gray-300 font-bold block mb-1">1. Choose Spell</label>
                    <select x-model="castSpellForm.spellName" @change="onCastSpellSelectionChange()"
                        class="w-full bg-dark-950 border border-brand-500/60 rounded-xl p-2.5 text-white font-bold outline-none focus:border-brand-400">
                        <template x-for="sp in castableSpellsList" :key="sp.name">
                            <option :value="sp.name"
                                x-text="`${sp.level === 0 ? '[Cantrip]' : '[Lvl ' + sp.level + ']'} ${sp.name} (${sp.actionType === 'bonus' ? 'Bonus Action' : (sp.actionType === 'reaction' ? 'Reaction' : 'Action')}${sp.conc ? ' • 🧠 Conc' : ''})`"></option>
                        </template>
                    </select>
                </div>

                <!-- 2. Full Spell Information Card -->
                <template x-if="selectedCastSpell">
                    <div class="bg-dark-950 border border-gray-800 rounded-xl p-3.5 space-y-2.5">
                        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-gray-800 pb-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-base font-black text-white" x-text="selectedCastSpell.name"></span>
                                <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-brand-950/80 border border-brand-500/40 text-brand-300"
                                    x-text="selectedCastSpell.level === 0 ? 'Cantrip' : `Level ${selectedCastSpell.level}`"></span>
                                <span x-show="selectedCastSpell.conc"
                                    class="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-950/80 border border-amber-500/50 text-amber-300">
                                    🧠 Concentration
                                </span>
                            </div>
                            <span class="text-[11px] text-gray-400 font-semibold" x-text="`Source: ${selectedCastSpell.source || 'Spellbook'}`"></span>
                        </div>

                        <!-- Tactical Quick Stats Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                            <div class="bg-dark-900 p-2 rounded-lg border border-gray-800">
                                <span class="text-gray-400 block text-[10px] uppercase">Casting Time</span>
                                <strong class="text-blue-300"
                                    x-text="selectedCastSpell.actionType === 'bonus' ? 'Bonus Action' : (selectedCastSpell.actionType === 'reaction' ? 'Reaction' : '1 Action')"></strong>
                            </div>
                            <div class="bg-dark-900 p-2 rounded-lg border border-gray-800">
                                <span class="text-gray-400 block text-[10px] uppercase">Range</span>
                                <strong class="text-white" x-text="selectedCastSpell.range || 'Self'"></strong>
                            </div>
                            <div class="bg-dark-900 p-2 rounded-lg border border-gray-800">
                                <span class="text-gray-400 block text-[10px] uppercase">Duration</span>
                                <strong class="text-white" x-text="selectedCastSpell.duration || 'Instantaneous'"></strong>
                            </div>
                            <div class="bg-dark-900 p-2 rounded-lg border border-gray-800">
                                <span class="text-gray-400 block text-[10px] uppercase">Atk / Save</span>
                                <strong class="text-amber-300"
                                    x-text="selectedCastSpell.isHealing ? '💚 Healing' : (selectedCastSpell.useSpellDc ? `DC ${stats.spellDC} ${selectedCastSpell.saveStat}` : (selectedCastSpell.damage && selectedCastSpell.damage !== '—' ? `${stats.spellAtkStr} Spell Atk` : 'Utility / Auto'))"></strong>
                            </div>
                        </div>

                        <!-- Live Damage / Effect Preview (Including Upcast Scaling) -->
                        <div x-show="(selectedCastSlotOption && selectedCastSlotOption.scaledDamage) || (selectedCastSpell.damage && selectedCastSpell.damage !== '—')"
                            class="bg-brand-950/30 border border-brand-500/40 rounded-lg p-2.5 flex items-center justify-between gap-2">
                            <div>
                                <span class="text-[11px] uppercase font-bold text-brand-300 block">
                                    <span x-text="selectedCastSpell.isHealing ? '💚 Healing Output' : '💥 Damage / Effect Output'"></span>
                                    <span x-show="selectedCastSlotOption && selectedCastSlotOption.slotLevel > selectedCastSpell.level"
                                        class="ml-1 text-amber-300 font-black"
                                        x-text="`(Upcast at Level ${selectedCastSlotOption?.slotLevel})`"></span>
                                </span>
                                <strong class="text-sm md:text-base font-black text-white"
                                    x-text="(selectedCastSlotOption && selectedCastSlotOption.scaledDamage) ? selectedCastSlotOption.scaledDamage : selectedCastSpell.damage"></strong>
                            </div>
                            <div x-show="selectedCastSpell.slotScaling && selectedCastSpell.slotScaling.length > 0" class="text-right">
                                <span class="text-[10px] text-gray-400 block">Upcast Scaling:</span>
                                <div class="flex flex-wrap justify-end gap-1 mt-0.5">
                                    <template x-for="sc in selectedCastSpell.slotScaling" :key="sc.slotLevel">
                                        <span class="px-1.5 py-0.5 rounded bg-dark-900 border border-gray-700 text-[10px] font-bold text-brand-200"
                                            x-text="`${sc.label}: ${sc.damage}`"></span>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Full Spell Description -->
                        <div class="text-xs text-gray-300 leading-relaxed bg-dark-900/70 p-2.5 rounded-lg border border-gray-800/80 max-h-36 overflow-y-auto"
                            x-text="selectedCastSpell.desc || 'No description available.'"></div>
                    </div>
                </template>

                <!-- 3. Select Slot or Innate / Item Resource -->
                <div>
                    <label class="text-gray-300 font-bold block mb-1">2. Spell Slot / Resource to Spend</label>
                    <select x-model="castSpellForm.selectedSlotKey"
                        class="w-full bg-dark-950 border rounded-xl p-2.5 font-bold outline-none transition"
                        :class="(selectedCastSlotOption && !selectedCastSlotOption.canCast) ? 'border-red-500 text-red-300' : 'border-gray-700 text-white focus:border-brand-500'">
                        <template x-for="opt in castSpellSlotOptions" :key="opt.key">
                            <option :value="opt.key"
                                x-text="`${opt.label}${opt.scaledDamage && opt.slotLevel > (selectedCastSpell?.level || 0) ? ' ➔ ' + opt.scaledDamage : ''}`"></option>
                        </template>
                    </select>

                    <!-- Exhausted Slot / Resource Warning (Shown instead of hiding the option!) -->
                    <div x-show="selectedCastSlotOption && !selectedCastSlotOption.canCast"
                        class="mt-2 p-2.5 rounded-xl bg-red-950/60 border border-red-500/70 text-red-200 text-xs flex items-center gap-2">
                        <span class="text-base">⚠️</span>
                        <div>
                            <strong class="font-bold block text-red-300">Cannot cast with this option: No slots/charges remaining!</strong>
                            <span>Select another available slot level above, or take a rest to recover spent slots.</span>
                        </div>
                    </div>

                    <!-- Concentration replacement notice -->
                    <div x-show="selectedCastSpell && selectedCastSpell.conc && data.concentration?.active && data.concentration?.spellName !== selectedCastSpell.name"
                        class="mt-2 p-2 rounded-xl bg-amber-950/50 border border-amber-500/60 text-amber-200 text-xs flex items-center gap-2">
                        <span>🧠</span>
                        <span>Casting this spell will replace active concentration on <strong x-text="data.concentration?.spellName"></strong>.</span>
                    </div>
                </div>

                <!-- 4. Optional Log Note -->
                <div>
                    <label class="text-gray-400 block mb-1 text-xs">Optional Combat Note (for Session Log)</label>
                    <input type="text" x-model="castSpellForm.comment"
                        placeholder="e.g. Target: Bandit Captain, rolled 21 dmg, enemy failed save..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2 text-white text-xs outline-none focus:border-brand-500">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800 shrink-0">
                    <button type="button" @click="modalCastSpellOpen = false"
                        class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit"
                        :disabled="!selectedCastSpell || !selectedCastSlotOption || !selectedCastSlotOption.canCast"
                        class="px-5 py-2 bg-brand-600 hover:bg-brand-500 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg text-xs font-bold text-white shadow flex items-center gap-1.5">
                        <span>✨</span> Confirm Cast
                    </button>
                </div>
            </form>
        </div>
    </div>
