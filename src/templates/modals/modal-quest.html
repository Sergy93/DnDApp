<!-- MODAL: QUEST CREATE / EDIT -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalQuestOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-lg w-full p-5 shadow-[0_0_50px_rgba(139,92,246,0.3)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2.5 mb-4">
                <h3 class="text-base font-bold text-brand-300 flex items-center gap-2">
                    <span>🗺️</span>
                    <span x-text="editingQuestId ? 'Edit Quest / Objective' : 'New Quest / Objective'"></span>
                </h3>
                <button @click="modalQuestOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <form @submit.prevent="handleSaveQuest()" class="space-y-4 text-xs md:text-sm">
                <div>
                    <label class="text-gray-300 font-bold block mb-1">Quest Title *</label>
                    <input type="text" x-model="questForm.title" required
                        placeholder="e.g. Find the Lost Relic of Ilmater"
                        class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2.5 text-white outline-none focus:border-brand-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-gray-400 block mb-1">Location / Target</label>
                        <input type="text" x-model="questForm.location"
                            placeholder="e.g. Waterdeep, Crypts"
                            class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2 text-white outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="text-gray-400 block mb-1">Reward / Bounty</label>
                        <input type="text" x-model="questForm.reward"
                            placeholder="e.g. 250 GP, Magic Ring"
                            class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2 text-white outline-none focus:border-brand-500">
                    </div>
                </div>

                <div>
                    <label class="text-gray-400 block mb-1">Status</label>
                    <select x-model="questForm.status"
                        class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2 text-white outline-none focus:border-brand-500">
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div>
                    <label class="text-gray-400 block mb-1">Description & Objectives</label>
                    <textarea x-model="questForm.desc" rows="4"
                        placeholder="Details, clues, NPCs involved, requirements..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-xl p-2.5 text-white outline-none focus:border-brand-500"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalQuestOpen = false"
                        class="px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit"
                        class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save Quest</button>
                </div>
            </form>
        </div>
    </div>
