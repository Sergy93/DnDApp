<!-- GENERIC MODAL -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-[100] flex items-center justify-center p-4"
        x-show="modalDialog.open">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-lg md:max-w-xl max-h-[85vh] w-full p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)] flex flex-col">
            <div class="flex items-center gap-3 mb-3 border-b border-gray-800 pb-3 shrink-0">
                <span class="text-2xl" x-text="modalDialog.icon"></span>
                <h3 class="text-base font-bold text-white" x-text="modalDialog.title"></h3>
            </div>
            <form @submit.prevent="resolveDialog(true)" class="flex flex-col flex-1 min-h-0">
                <div class="text-xs md:text-sm text-gray-300 leading-relaxed mb-3 whitespace-pre-line overflow-y-auto pr-1 flex-1" x-text="modalDialog.message"></div>
                <div x-show="modalDialog.showInput" class="mb-4">
                    <input type="text" x-model="modalDialog.inputValue" :placeholder="modalDialog.inputPlaceholder || 'Enter value...'"
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2.5 text-white outline-none focus:border-brand-500 text-xs sm:text-sm">
                </div>
                <div class="flex justify-end gap-2.5 pt-2 border-t border-gray-800 shrink-0">
                    <button type="button" x-show="modalDialog.showCancel" @click="resolveDialog(false)"
                        class="px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-xl text-xs font-bold text-gray-300 transition"
                        x-text="modalDialog.cancelText"></button>
                    <button type="submit"
                        class="px-4 py-2 rounded-xl text-xs font-bold text-white shadow transition"
                        :class="modalDialog.confirmClass"
                        x-text="modalDialog.confirmText"></button>
                </div>
            </form>
        </div>
    </div>
