<!-- MODAL: SESSION EVENT LOG -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalLogOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-xl w-full max-h-[85vh] p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3 shrink-0">
                <div class="flex items-center gap-2">
                    <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                        <span>📜</span> Session Event History
                    </h3>
                    <span x-show="data.sessionLog && data.sessionLog.length > 0"
                        class="bg-brand-600/30 border border-brand-500/50 text-brand-300 rounded-full px-2 py-0.5 text-xs font-mono font-bold"
                        x-text="`${data.sessionLog.length} events`"></span>
                </div>
                <button @click="modalLogOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-2 mb-3 text-xs shrink-0">
                <span class="text-gray-400">Key events during gameplay (damage, healing, rests, concentration & statuses):</span>
                <div class="flex items-center gap-2">
                    <button type="button" @click="addCustomLogEntry()"
                        class="px-2.5 py-1 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-lg text-xs shadow flex items-center gap-1 transition">
                        <span>✍️</span> + Add Note / Entry
                    </button>
                    <button type="button" @click="clearSessionLog()"
                        x-show="data.sessionLog && data.sessionLog.length > 0"
                        class="text-red-400 hover:text-red-300 font-bold underline flex items-center gap-1 text-xs">
                        <span>🗑️</span> Clear Log
                    </button>
                </div>
            </div>

            <!-- Event List -->
            <div class="overflow-y-auto space-y-2 flex-1 pr-1">
                <template x-if="!data.sessionLog || data.sessionLog.length === 0">
                    <div class="text-center py-10 px-4 border border-dashed border-gray-800 rounded-xl bg-dark-950/50">
                        <span class="text-3xl block mb-2">📜</span>
                        <p class="text-gray-400 text-sm font-semibold">No events recorded in this session yet.</p>
                        <p class="text-gray-500 text-xs mt-1">Events such as damage received, healing, rests, concentration, and conditions will appear here automatically.</p>
                    </div>
                </template>

                <template x-for="event in (data.sessionLog || [])" :key="event.id">
                    <div class="p-3 rounded-xl border border-gray-800/80 bg-dark-950/80 flex items-start gap-3 transition hover:border-gray-700 group">
                        <span class="text-xl mt-0.5 shrink-0" x-text="event.icon"></span>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center gap-2">
                                <span class="font-bold text-white text-xs md:text-sm" x-text="event.title"></span>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <span class="font-mono text-[11px] text-gray-500" x-text="event.time"></span>
                                    <button type="button" @click="editLogComment(event.id)"
                                        class="text-gray-400 hover:text-brand-300 hover:bg-dark-800 px-1.5 py-0.5 rounded font-bold text-xs transition flex items-center gap-1"
                                        :title="event.comment ? 'Edit comment / note' : 'Add comment / note'">
                                        <span>💬</span>
                                        <span class="text-[10px]" x-text="event.comment ? 'Edit Note' : 'Note'"></span>
                                    </button>
                                    <button type="button" @click="removeLogEntry(event.id)"
                                        class="text-gray-500 hover:text-red-400 hover:bg-dark-800 p-0.5 rounded font-bold text-xs transition"
                                        title="Delete this entry">✕</button>
                                </div>
                            </div>
                            <p class="text-xs text-gray-300 mt-0.5 break-words leading-relaxed" x-text="event.text"></p>
                            <div x-show="event.comment" class="mt-1.5 px-2.5 py-1.5 rounded-lg bg-brand-950/40 border border-brand-500/40 text-xs text-brand-200 flex items-start justify-between gap-2">
                                <div class="break-words">
                                    <strong class="text-brand-300 font-bold mr-1">💬 Note:</strong>
                                    <span x-text="event.comment"></span>
                                </div>
                                <button type="button" @click="editLogComment(event.id)" class="text-[10px] text-brand-400 hover:text-white underline shrink-0">Edit</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div class="flex justify-end pt-3 border-t border-gray-800 shrink-0 mt-3">
                <button type="button" @click="modalLogOpen = false"
                    class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Close</button>
            </div>
        </div>
    </div>
