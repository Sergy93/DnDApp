<!-- MODAL: SHORT REST -->
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalShortRestOpen">
        <div class="bg-dark-900 border border-blue-500/50 rounded-2xl max-w-md w-full p-5 md:p-6 shadow-[0_0_40px_rgba(59,130,246,0.3)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <h3 class="text-lg font-bold text-blue-300 flex items-center gap-2">
                    <span>⛺</span> Short Rest (1 hour)
                </h3>
                <button @click="modalShortRestOpen = false" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <p class="text-xs md:text-sm text-gray-300 mb-3 leading-relaxed">
                Spend hit dice to heal <strong>1<span x-text="shortRestSelectedHitDie"></span> + CON (<span x-text="stats.computedAttrs.CON.modStr"></span>)</strong> per die.
                <template x-if="shortRestHealingBonus">
                    <span class="text-brand-300 block mt-1"><strong x-text="`${shortRestHealingBonus.name}:`"></strong> +<span x-text="shortRestHealingBonus.die"></span> extra to total healing.</span>
                </template>
            </p>

            <div class="bg-dark-950 p-3 rounded-xl border border-gray-800 mb-4 text-xs md:text-sm space-y-2">
                <div class="flex justify-between text-gray-300">
                    <span>Current HP:</span>
                    <span class="font-bold text-white" x-text="`${data.vitals.currentHp} / ${data.vitals.maxHp}`"></span>
                </div>
                <div class="flex justify-between text-gray-300">
                    <span>Available Hit Dice:</span>
                    <span class="font-bold text-brand-300" x-text="`${availableHitDiceCount} of ${totalHitDiceCount} (${stats.hitDiceList})`"></span>
                </div>
                <div class="flex justify-between text-blue-300 border-t border-gray-800 pt-1.5 font-semibold">
                    <span>Automatic Recharges:</span>
                    <span class="text-right max-w-[200px] truncate" x-text="shortRestRecharges.length > 0 ? shortRestRecharges.join(' • ') : 'None'"></span>
                </div>
                <div class="text-green-400 font-bold">✓ Death saving throws are always cleared.</div>
            </div>

            <template x-if="(data.identity?.classes || []).length > 1">
                <div class="mb-4">
                    <label class="block text-xs md:text-sm font-bold text-gray-200 mb-1.5">Class Hit Die to spend:</label>
                    <select x-model.number="shortRestClassIndex"
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white text-xs md:text-sm outline-none focus:border-blue-500">
                        <template x-for="(cls, idx) in data.identity?.classes || []" :key="idx">
                            <option :value="idx" x-text="`${cls.name} (${getClassHitDie(cls)}, Lvl ${cls.level})`"></option>
                        </template>
                    </select>
                </div>
            </template>

            <div class="mb-5">
                <label class="block text-xs md:text-sm font-bold text-gray-200 mb-1.5">How many hit dice do you want to spend?</label>
                <select x-model.number="shortRestDiceSelected"
                    class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white text-xs md:text-sm outline-none focus:border-blue-500">
                    <option value="0">0 dice (Only rest and recharge pact/traits)</option>
                    <template x-for="i in availableHitDiceCount" :key="i">
                        <option :value="i" x-text="`${i} die${i > 1 ? 's' : ''} (${i}${shortRestSelectedHitDie} ${stats.computedAttrs.CON.mod * i >= 0 ? '+' + (stats.computedAttrs.CON.mod * i) : (stats.computedAttrs.CON.mod * i)}${hasSongOfRest ? ' + ' + songOfRestDie + ' extra' : ''})`"></option>
                    </template>
                </select>
            </div>

            <div class="flex justify-end gap-3 pt-2 border-t border-gray-800">
                <button @click="modalShortRestOpen = false"
                    class="px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs md:text-sm font-bold text-gray-300">Cancel</button>
                <button @click="applyShortRest(shortRestDiceSelected)"
                    class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs md:text-sm font-bold text-white shadow">Complete Rest</button>
            </div>
        </div>
    </div>
