<!-- MODAL: CONSUMABLES MANAGEMENT -->
    <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        x-show="modalConsumableOpen">
        <div class="bg-dark-900 border border-brand-500/60 rounded-2xl max-w-sm w-full p-5 shadow-[0_0_50px_rgba(168,85,247,0.35)]">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-3">
                <h3 class="text-base font-bold text-white" x-text="editingConsumableIndex !== null ? '✏️ Edit Consumable' : '🧪 Add Consumable'"></h3>
                <button @click="modalConsumableOpen = false" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form @submit.prevent="handleSaveConsumable()" class="space-y-3 text-xs md:text-sm">
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Name *</label>
                    <input type="text" x-model="consumableForm.name" required placeholder="e.g. Potion of Healing, Rations..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-gray-300 font-semibold mb-1">Quantity / Details</label>
                    <input type="text" x-model="consumableForm.qty" placeholder="e.g. 3, 2 flasks, 50 bolts..."
                        class="w-full bg-dark-950 border border-gray-700 rounded-lg p-2 text-white outline-none focus:border-brand-500">
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" @click="modalConsumableOpen = false" class="px-3.5 py-2 bg-dark-800 hover:bg-dark-700 rounded-lg text-xs font-bold text-gray-300">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 rounded-lg text-xs font-bold text-white shadow">Save</button>
                </div>
            </form>
        </div>
    </div>
